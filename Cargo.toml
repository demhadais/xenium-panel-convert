[workspace]
members = ["crates/cli","crates/core"]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["Ahmed Said"]
license = "MIT"
repository = "https://github.com/demhadais/xenium-panel-validate"
version = "0.4.0"
description = "A library and CLI for validating the inputs for a Xenium panel design at the SCBL at The Jackson Laboratory."
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0.102"
camino = {version = "1.2.4", features = ["serde1"] }
csv = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = { version = "1.1.2", default-features = false, features = ["std", "serde", "parse"] }
reqwest = "0.13.4"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
url = { version = "2.5.8", features = ["serde"] }
futures = { version = "0.3.32" }
phf_codegen = { version = "0.14.0", features = ["ptrhash"] }
phf = { version = "0.14.0", features = ["ptrhash"] }
clap = { version = "4.6.1", features = ["derive"] }
hdf5-metno = { version = "0.14.0", features = ["static", "zlib", "lzf"] }
ndarray = { version = "0.17.2" }
sprs = { version = "0.11.4", default-features = false }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = { version = "2.0.19" }
bytes = { version = "1.12.1" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
implicit_hasher = "allow"

[profile]
release = { lto = true, codegen-units = 1, strip = true }
